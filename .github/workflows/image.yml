# Baut das Abbild und schiebt es nach GHCR.
#
# Der Tag ist das, was flussabwärts zählt: holzkube-infra pinnt
# `ghcr.io/holzcloud/holzcloud-cms:<tag>@sha256:<digest>`, Renovate folgt dem
# Tag, Flux rollt es aus. Ein Deploy ist also ein Commit dort und nicht ein
# Push hier. Dieser Ablauf fasst den Cluster nie an.
#
# Neben `release.yml` und nicht darin: das Freigabe-Binär ist für den, der
# dieses Programm auf einem eigenen Server betreibt, und soll nicht davon
# abhängen, ob ein Abbildbau durchgeht.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Abbild bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe braucht die Historie. Ohne sie fällt die Fassung im
          # Binär auf einen blossen Commit-Hash zurück — derselbe Fehler, für
          # den es den Tag v1.4 gab.
          fetch-depth: 0

      - name: Fassung und Commit bestimmen
        id: stand
        run: |
          set -euo pipefail
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Beschriftung
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=main-,enable={{is_default_branch}}

      # Auf einem Pull Request wird gebaut und nicht geschoben: der Bau ist die
      # Prüfung, dass das Dockerfile noch trägt.
      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.stand.outputs.version }}
            COMMIT=${{ steps.stand.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # holzkube-infra jetzt nachsehen lassen statt beim nächsten Tageslauf.
      #
      # Der Weg des Deploys bleibt derselbe und führt weiter über jenes
      # Repository: Renovate öffnet den Pull Request, dessen Prüfungen halten
      # den Merge auf, Flux rollt aus. Dieser Schritt nimmt nur das Warten weg.
      #
      # Braucht das Repository-Geheimnis INFRA_DISPATCH_TOKEN — ein
      # feingranulares PAT auf holzcloud/holzkube-infra mit Actions: read and
      # write und sonst nichts. GITHUB_TOKEN geht nicht: es gilt nur für dieses
      # Repository, und holzkube-infra ist privat.
      #
      # continue-on-error mit Absicht: das Abbild ist an dieser Stelle schon
      # geschoben. Ein Fehlschlag hier kostet einen Tag Verzögerung und keinen
      # Deploy, und darf einen guten Bau nicht rot färben.
      - name: Renovate in holzkube-infra anstossen
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::INFRA_DISPATCH_TOKEN ist nicht gesetzt - der Anstoss entfällt."
            echo "Das Abbild ist geschoben; holzkube-infra findet es beim nächsten Renovate-Lauf."
            exit 0
          fi
          gh workflow run renovate.yaml --repo holzcloud/holzkube-infra
          echo "renovate.yaml in holzcloud/holzkube-infra angestossen."
