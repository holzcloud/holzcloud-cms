# Builds the image and pushes it to GHCR.
#
# The tag is what counts downstream: holzkube-infra pins
# `ghcr.io/holzcloud/holzcloud-cms:<tag>@sha256:<digest>`, Renovate follows the
# tag, Flux rolls it out. A deploy is therefore a commit there and not a push
# here. This workflow never touches the cluster.
#
# Beside `release.yml` and not inside it: the release binary is for whoever runs
# this program on a server of their own, and must not depend on whether an image
# build goes through.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs the history. Without it the version in the
          # binary falls back to a bare commit hash — the same fault the tag
          # v1.4 exists for.
          fetch-depth: 0

      - name: Fassung und Commit bestimmen
        id: stand
        run: |
          set -euo pipefail
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Without this step buildx builds with the "docker" driver, and that one
      # cannot export a cache: "Cache export is not supported for the docker
      # driver". The build breaks off before the first line of the Dockerfile
      # has been read.
      - uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Beschriftung
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # This project's releases are called v1.4 and v1.5, so two
            # places. That is not valid semver, and the semver rule produces
            # nothing at all from it: the first run on the tag v1.5 broke off
            # with "tag is needed when pushing to registry", because the list
            # of tags stayed empty. type=ref takes the name of the tag as it
            # is. The semver rule stays beside it so that a three-place tag
            # additionally yields the version without the v.
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=main-,enable={{is_default_branch}}

      # On a pull request it is built and not pushed: the build is the check
      # that the Dockerfile still carries.
      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.stand.outputs.version }}
            COMMIT=${{ steps.stand.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Have holzkube-infra look now instead of at the next daily run.
      #
      # The path of the deploy stays the same and still leads through that
      # repository: Renovate opens the pull request, its checks hold the merge
      # up, Flux rolls out. This step only takes the waiting away.
      #
      # Needs the repository secret INFRA_DISPATCH_TOKEN — a fine-grained PAT
      # on holzcloud/holzkube-infra with Actions: read and write and nothing
      # else. GITHUB_TOKEN does not do: it holds only for this repository, and
      # holzkube-infra is private.
      #
      # continue-on-error on purpose: at this point the image is already
      # pushed. A failure here costs a day's delay and no deploy, and must not
      # turn a good build red.
      - name: Renovate in holzkube-infra anstossen
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::INFRA_DISPATCH_TOKEN is not set - the nudge is skipped."
            echo "The image is pushed; holzkube-infra finds it at the next Renovate run."
            exit 0
          fi
          gh workflow run renovate.yaml --repo holzcloud/holzkube-infra
          echo "renovate.yaml in holzcloud/holzkube-infra angestossen."
