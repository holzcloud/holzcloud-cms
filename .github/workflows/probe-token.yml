# A throwaway measurement, to be deleted in the next commit.
#
# The question: does a workflow run triggered by a PUSH get a GITHUB_TOKEN that
# may publish a release? A run this session DISPATCHED could not — it failed
# with "Resource not accessible by integration", because a run an App
# dispatched carries that App's scopes. A push is a different event, and the
# answer decides whether an automated release pipeline can be built from here
# at all or needs a secret from the operator.
#
# It creates a DRAFT release, which mints no tag, and deletes it again.
name: Probe (temporary)

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/probe-token.yml' ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Can this token publish a release?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          out=$(gh api "repos/$REPO/releases" -X POST \
            -f tag_name=probe-delete-me -f name=probe -F draft=true 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            echo "VERDICT: a push-triggered token may NOT publish a release"
            echo "$out"
            exit 0
          fi
          id=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "VERDICT: a push-triggered token MAY publish a release (draft $id)"
          gh api "repos/$REPO/releases/$id" -X DELETE && echo "draft deleted again"
