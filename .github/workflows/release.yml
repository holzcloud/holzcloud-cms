name: Release

on:
  push:
    tags: [ 'v*' ]
  # And by hand, which is how a tag gets made at all when it cannot be pushed
  # from a working copy.
  #
  # Press this in the Actions tab, as a person. Triggering it through the API as
  # an integration gets far enough to build and test and then fails at the last
  # step with
  #
  #   HTTP 403: Resource not accessible by integration
  #   (https://api.github.com/repos/holzcloud/holzcloud-cms/releases)
  #
  # because a run an App dispatched carries that App's scopes and not the
  # repository's, whatever `permissions:` says below. Measured 2026-09-14, run
  # 12. A tag push by a person, the path this file has always had, is
  # unaffected.
  #
  # v2.0 and v2.1 were built, closed and recorded, and then sat untagged:
  # `git push origin refs/tags/v2.0` is answered 403 for the credential the
  # development environment holds, while branch refs on that same credential go
  # through. The consequence is not cosmetic — image.yml stamps every image with
  # `git describe --tags`, so an untagged release ships as "v1.10-31-g9fe3279".
  #
  # This path exists for that, and it is the honest shape rather than a trick:
  # the release is built and published by the same job either way, and the only
  # difference is who mints the tag. A dispatch can mint one; a push reacts to
  # one somebody else minted.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to create and release, for example v2.1'
        required: true
        type: string
      commit:
        description: 'The commit it names. Empty means the head of the default branch.'
        required: false
        type: string

# Least privilege by default: the write scope is granted on the one job that
# publishes, not to the whole file.
permissions:
  contents: read

env:
  # Pure-Go SQLite driver: the binary must build without a C toolchain.
  CGO_ENABLED: "0"
  # A test that skips itself reports green and checks nothing. On a runner a
  # missing plugin module is therefore a fault; on a development machine it
  # stays one of several good reasons to have checked out only part of the
  # tree.
  HOLZCLOUD_TEST_REQUIRE_WASM: "1"

jobs:
  release:
    name: Build and publish the release binary
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # git describe needs history. Leave this out and the version baked into
        # the binary silently degrades to a bare commit hash again, which is the
        # exact defect the v1.4 tag was created to fix.
        fetch-depth: 0
        # On a dispatch: the commit the tag is to name. Empty falls back to the
        # default branch, which is what checkout does with an empty ref anyway.
        ref: ${{ inputs.commit }}

    # The name this release carries, in one place.
    #
    # GITHUB_REF_NAME is the tag on a push and the BRANCH on a dispatch, so
    # reading it directly would have published a release called "main".
    - name: Name the release
      id: name
      run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

    # The tag, locally, so that `git describe --tags` in the build below names
    # the release rather than degrading to a bare hash. It is NOT pushed from
    # here, and that is the whole lesson of this file:
    #
    #   ! [remote rejected] v2.0 -> v2.0 (refusing to allow a GitHub App to
    #     create or update workflow `.github/workflows/ci.yml` without
    #     `workflows` permission)
    #
    # A new tag ref has no base to be compared against, so every workflow file
    # in the tree counts as newly added — and no `permissions:` key can grant
    # GITHUB_TOKEN the scope that would allow it. The same wall is what answers
    # a development environment 403 on `git push origin refs/tags/v2.0` while
    # letting branch pushes through, which was misread for two milestones as
    # "this credential cannot write tag refs".
    #
    # The tag is therefore minted by the Releases API instead, in the publish
    # step, which takes the commit as --target and is not a ref push.
    - name: Name the tag locally, for the version in the binary
      if: github.event_name == 'workflow_dispatch'
      env:
        TAG: ${{ steps.name.outputs.tag }}
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "::error::$TAG is already on the remote. A published tag is never moved."
          exit 1
        fi
        # Lightweight, because this one never leaves the runner: git describe
        # reads it either way, and an annotated tag would need a committer
        # identity configured for a tag nobody will ever see.
        git tag "$TAG"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    # A tag on broken code must not become a published release.
    - name: Test
      run: go test ./...

    - name: Build linux/amd64
      env:
        GOOS: linux
        GOARCH: amd64
      run: |
        go build -trimpath \
          -ldflags="-s -w -X main.Version=$(git describe --tags --always) -X main.Commit=$(git rev-parse --short HEAD)" \
          -o holzcloud-linux-amd64 ./cmd/holzcloud
        sha256sum holzcloud-linux-amd64 > holzcloud-linux-amd64.sha256
        cat holzcloud-linux-amd64.sha256

    # The runner's preinstalled gh CLI, not a third-party release action: one
    # less unpinned stranger in the publishing path.
    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.name.outputs.tag }}
        # Empty on a tag push, where the tag already says which commit it is.
        TARGET: ${{ github.event_name == 'workflow_dispatch' && (inputs.commit || github.sha) || '' }}
      run: |
        # --target names the commit the tag is to be created at, and creating
        # it is what this call does when the tag does not exist yet. On a tag
        # push the tag is already there and the flag is left off.
        gh release create "${TAG}" \
          ${TARGET:+--target "${TARGET}"} \
          --title "${TAG}" \
          --generate-notes \
          holzcloud-linux-amd64 \
          holzcloud-linux-amd64.sha256
