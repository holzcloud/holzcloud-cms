name: Release

# Nothing here fires by itself. Every way in is somebody saying "release it
# now" — a push to main does not publish, however much it changed.
on:
  # 1. A tag pushed by hand, the way v1.8 through v1.10 were made.
  push:
    tags: [ 'v*' ]

  # 2. A push to the `release` branch, which is a button rather than a branch:
  #    it holds no work of its own and is only ever fast-forwarded to the
  #    commit that is to be released.
  #
  #    It exists because of where this repository is worked from. The
  #    development environment's proxy allows branch pushes and refuses writes
  #    to refs/tags — by git and by the Git Refs API alike, with
  #    "Write access to this GitHub API path is not permitted through this
  #    proxy" — so a session there cannot make a tag, and a run it DISPATCHES
  #    carries its own App's scopes and fails at the publish step with
  #    "Resource not accessible by integration" (measured 2026-09-14, run 12).
  #
  #    A run started by a PUSH is on the far side of both walls and holds the
  #    repository's ordinary token. Measured 2026-09-15 with a throwaway
  #    workflow: it may publish a release.
  #
  #    So: pushing this branch is the one thing such a session can do that ends
  #    in a release, and it takes a deliberate act to do it.
    branches: [ 'release' ]

  # 3. The button in the Actions tab, for a person. With no inputs it releases
  #    the version the CHANGELOG names, at the head of the default branch —
  #    the same thing route 2 does. With inputs it releases a named version at
  #    a named commit, which is how a release that was missed gets made later
  #    from the code it actually belongs to.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, for example v2.1. Empty: read the CHANGELOG.'
        required: false
        type: string
      commit:
        description: 'The commit it names. Empty: the head of the default branch.'
        required: false
        type: string

# Least privilege by default: the write scope is granted on the one job that
# publishes, not to the whole file.
permissions:
  contents: read

env:
  # Pure-Go SQLite driver: the binary must build without a C toolchain.
  CGO_ENABLED: "0"
  # A test that skips itself reports green and checks nothing. On a runner a
  # missing plugin module is therefore a fault; on a development machine it
  # stays one of several good reasons to have checked out only part of the
  # tree.
  HOLZCLOUD_TEST_REQUIRE_WASM: "1"

jobs:
  release:
    name: Build and publish the release binary
    runs-on: ubuntu-latest

    permissions:
      contents: write
      # For the last step: starting image.yml on the tag this job mints.
      actions: write

    steps:
    # The checkout comes first, because the decision below reads CHANGELOG.md
    # and a file cannot be read before it is on the disk. Its ref is whatever
    # the event brought — the tag, the release branch, or the default branch on
    # a dispatch — and a dispatch naming another commit moves to it afterwards.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # git describe needs history. Leave this out and the version baked into
        # the binary silently degrades to a bare commit hash again, which is the
        # exact defect the v1.4 tag was created to fix. It is also what lets the
        # step after next check out a commit this checkout did not name.
        fetch-depth: 0

    # What is being released. One answer, worked out once.
    #
    # GITHUB_REF_NAME is the TAG on a tag push and the BRANCH everywhere else,
    # so a step reading it directly once published a release called "main".
    - name: What is being released
      id: what
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_COMMIT: ${{ inputs.commit }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ "${GITHUB_REF:-}" != "${GITHUB_REF#refs/tags/}" ]; then
          # A tag somebody pushed by hand. It already says both things, and it
          # is on the remote by definition — this run exists BECAUSE it is.
          tag="$REF_NAME"
          commit="$SHA"
          minting=no
        else
          tag="${INPUT_TAG:-}"
          commit="${INPUT_COMMIT:-$SHA}"
          minting=yes
        fi

        # The version lives in the CHANGELOG, because that is where this project
        # already writes it: closing a milestone adds the heading, and a release
        # that disagreed with it would be one nobody could explain afterwards.
        # "The numbers are the same as the tags in the repository" — CHANGELOG.md
        # says so in its own opening.
        if [ -z "$tag" ]; then
          version=$(grep -m1 -oE '^## [0-9]+\.[0-9]+(\.[0-9]+)?' CHANGELOG.md | sed 's/^## //' || true)
          if [ -z "$version" ]; then
            echo "::error::No version heading found at the top of CHANGELOG.md."
            exit 1
          fi
          tag="v$version"
          echo "The CHANGELOG names $version, so this is $tag."
        fi

        # A published tag is never moved — but only the routes that MINT a tag
        # can offend against that. A run reacting to a tag somebody pushed finds
        # that tag on the remote every time, and refusing there would mean
        # refusing the oldest way into this file.
        #
        # A push to the release branch at a version that is already out is not
        # a mistake worth a red run, though: it is how a change to this file,
        # or to the changelog text, reaches the release page. That run moves
        # nothing and builds nothing; it only rewrites the page's text from
        # the CHANGELOG. A dispatch or a named tag still refuses.
        existing=no
        if [ "$minting" = yes ] && gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ -z "${INPUT_TAG:-}" ]; then
            existing=yes
            echo "::notice::$tag is already released; only its notes are refreshed from the CHANGELOG."
          else
            echo "::error::$tag is already released. A published tag is never moved."
            exit 1
          fi
        fi
        echo "existing=$existing" >> "$GITHUB_OUTPUT"

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "minting=$minting" >> "$GITHUB_OUTPUT"
        echo "Releasing $tag at $commit."

    # Only a dispatch that named another commit moves; everything else is
    # already standing on the right one.
    - name: Stand on the commit being released
      if: steps.what.outputs.existing != 'yes'
      run: git checkout --detach "${{ steps.what.outputs.commit }}"

    # The tag, locally, so that `git describe --tags` in the build below names
    # the release rather than degrading to a bare hash. It is not pushed: the
    # tag reaches the remote through the Releases API in the publish step, which
    # takes the commit as --target and is not a ref push.
    #
    # Lightweight, because this one never leaves the runner — an annotated tag
    # would want a committer identity configured for a tag nobody will ever see.
    - name: Name the tag locally, for the version in the binary
      if: steps.what.outputs.existing != 'yes'
      run: git tag "${{ steps.what.outputs.tag }}"

    - name: Set up Go
      if: steps.what.outputs.existing != 'yes'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    # A module in the tree is a promise only if somebody recomputes it. The
    # test suite runs the committed .wasm, so a module compiled against an
    # older SDK is green here and wrong in the field — which is how v2.2 nearly
    # went out with four of its five plugins built before the SDK grew Locales.
    # CI has had this step since the modules were committed; the release had
    # not, and the release is the one that ships them.
    - name: Verify the committed plugin modules are current
      if: steps.what.outputs.existing != 'yes'
      run: go run ./tools/wasm -check

    # A tag on broken code must not become a published release.
    - name: Test
      if: steps.what.outputs.existing != 'yes'
      run: go test ./...

    - name: Build linux/amd64
      if: steps.what.outputs.existing != 'yes'
      env:
        GOOS: linux
        GOARCH: amd64
      run: |
        go build -trimpath \
          -ldflags="-s -w -X main.Version=$(git describe --tags --always) -X main.Commit=$(git rev-parse --short HEAD)" \
          -o holzcloud-linux-amd64 ./cmd/holzcloud
        sha256sum holzcloud-linux-amd64 > holzcloud-linux-amd64.sha256
        cat holzcloud-linux-amd64.sha256

    # What is new, for the release page: the CHANGELOG's own section for this
    # version, from its heading to the next one. Until v2.9 the page carried
    # only GitHub's generated "Full Changelog" link, which says which commits
    # and nothing about what they changed; the sentences an operator needs are
    # already written, one file over.
    - name: Write the release notes from the CHANGELOG
      env:
        TAG: ${{ steps.what.outputs.tag }}
      run: |
        set -euo pipefail
        version="${TAG#v}"
        awk -v v="$version" '
          /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "::warning::CHANGELOG.md has no section for $version; the release page will carry only the generated notes."
        fi
        cat release-notes.md

    # The runner's preinstalled gh CLI, not a third-party release action: one
    # less unpinned stranger in the publishing path.
    - name: Publish the release
      if: steps.what.outputs.existing != 'yes'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.what.outputs.tag }}
        # Always named, never conditional. A `cond && '' || x` expression is a
        # trap here: the empty string is falsy, so it yields x whichever way the
        # condition falls. And it needs no condition — on a tag push this is the
        # commit that tag already names, which the API ignores for a tag that
        # exists.
        TARGET: ${{ steps.what.outputs.commit }}
      run: |
        # --target names the commit the tag is to be created at, and creating
        # the tag is what this call does when it does not exist yet. That is
        # the whole reason the tag is minted here rather than pushed: a release
        # is not a ref push, so neither the workflow token's missing scope for
        # .github/workflows nor the development proxy's refusal of refs/tags
        # applies to it.
        gh release create "${TAG}" \
          --target "${TARGET}" \
          --title "${TAG}" \
          --notes-file release-notes.md \
          --generate-notes \
          holzcloud-linux-amd64 \
          holzcloud-linux-amd64.sha256

    # The version is out already: its page gets the CHANGELOG's text and
    # nothing else changes — not the tag, not the files attached to it.
    - name: Refresh the notes of a release that is already out
      if: steps.what.outputs.existing == 'yes'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.what.outputs.tag }}
      run: |
        if [ ! -s release-notes.md ]; then
          echo "::error::CHANGELOG.md has no section for $TAG; the notes were left as they are."
          exit 1
        fi
        gh release edit "$TAG" --notes-file release-notes.md

    # The image comes from image.yml, which listens for tag pushes. A tag this
    # job mints is not one: the Releases API creates it with this workflow's
    # own token, and GitHub starts no workflow from an event that token
    # caused. So from v2.0 to v2.6 not one release reached GHCR as an image -
    # the newest tag there stayed v1.10, holzkube-infra stayed on it, and
    # Renovate, which follows the tags, had nothing newer to offer.
    #
    # workflow_dispatch is the documented exception to that rule. A tag pushed
    # by hand (route 1) already starts image.yml by itself, so only the routes
    # that mint one dispatch it - a second run on the same ref would only
    # cancel the first through image.yml's concurrency group.
    - name: Build the image for this tag
      if: steps.what.outputs.minting == 'yes' && steps.what.outputs.existing != 'yes'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.what.outputs.tag }}
      run: gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
