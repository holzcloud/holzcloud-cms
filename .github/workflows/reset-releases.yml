name: Reset the old releases

# A one-off. When the count started again at 0.0.1, the releases v1.4 to
# v2.9.1 and their tags had to go, and this session's environment may not
# delete either: its proxy refuses writes to refs/tags, and a run it dispatches
# lacks the scope to delete a release. A person pressing this button in the
# Actions tab has both.
#
# It touches only tags that begin with v1. or v2. — never a 0.x release — so it
# is harmless to press again, and harmless after 0.0.1 is out. Delete this file
# once it has run.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE-v1-v2 to delete every release and tag from v1.x and v2.x.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
    - name: Delete the releases and tags of the old count
      if: inputs.confirm == 'DELETE-v1-v2'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # The releases first, with their tags.
        gh release list --repo "$REPO" --limit 200 --json tagName --jq '.[].tagName' |
          { grep -E '^v[12]\.' || true; } | while read -r tag; do
            echo "release $tag"
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
          done
        # Then any tag of the old count that had no release.
        gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref' |
          sed 's#^refs/tags/##' | { grep -E '^v[12]\.' || true; } | while read -r tag; do
            echo "tag $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
          done
        echo "Left over:"
        gh release list --repo "$REPO" --limit 200
    - name: Refuse without the confirmation
      if: inputs.confirm != 'DELETE-v1-v2'
      run: |
        echo "::error::Nothing was deleted: type DELETE-v1-v2 to confirm."
        exit 1
