name: Remove the old images

# A one-off, like reset-releases.yml was. The container images of the old
# count (v1.x, v2.x, and the same numbers without the v) are removed from
# GHCR, so that nothing can pull a version that no longer exists as a release.
# An image version that also carries a 0.x tag is left alone. Delete this file
# once it has run.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE-OLD-IMAGES to delete every image version tagged v1.x or v2.x.'
        required: true
        type: string

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Delete the image versions of the old count
      if: inputs.confirm == 'DELETE-OLD-IMAGES'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OWNER: ${{ github.repository_owner }}
        NAME: ${{ github.event.repository.name }}
      run: |
        set -euo pipefail
        # The package lives under the user or under the organisation; ask
        # which one answers.
        base="/users/$OWNER/packages/container/$NAME"
        if ! gh api "$base" >/dev/null 2>&1; then
          base="/orgs/$OWNER/packages/container/$NAME"
        fi
        gh api "$base/versions" --paginate \
          --jq '.[] | [.id, (.metadata.container.tags | join(","))] | @tsv' > versions.tsv
        echo "All versions:"; cat versions.tsv
        while IFS=$'\t' read -r id tags; do
          old=no; new=no
          for t in ${tags//,/ }; do
            case "$t" in v1.*|v2.*|1.*|2.*) old=yes ;; v0.*|0.*) new=yes ;; esac
          done
          if [ "$old" = yes ] && [ "$new" = no ]; then
            echo "delete $id ($tags)"
            gh api -X DELETE "$base/versions/$id"
          fi
        done < versions.tsv
        echo "Left:"
        gh api "$base/versions" --paginate --jq '.[] | (.metadata.container.tags | join(","))'
    - name: Refuse without the confirmation
      if: inputs.confirm != 'DELETE-OLD-IMAGES'
      run: |
        echo "::error::Nothing was deleted: type DELETE-OLD-IMAGES to confirm."
        exit 1
