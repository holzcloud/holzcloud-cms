# Deliberately true: SECURITY.md and CODE_OF_CONDUCT.md explicitly point people
# who cannot use the private channel at a blank issue without details. Were this
# false, that fallback would be walled off, and two documents would promise a way
# that no longer exists.
blank_issues_enabled: true

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/holzcloud/holzcloud-cms/security/advisories/new
    about: >
      A vulnerability does not belong in a public issue. This channel is
      private; only the maintainer sees the report. The details are in
      SECURITY.md.

  - name: Build a template
    url: https://github.com/holzcloud/holzcloud-cms/blob/main/internal/tmplspec/TEMPLATE-SPEC.md
    about: >
      Building a template needs no contribution to the code. The complete data
      contract is in TEMPLATE-SPEC.md, and `holzcloud template check` checks a
      template without installing anything.
