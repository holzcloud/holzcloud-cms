{{define "content"}}
{{template "user_password-content" .}}
{{end}}

{{define "user_password-content"}}
<div class="card">
    <p class="text-muted" style="margin-bottom: var(--space-3);">
        {{t "Passwort ändern für"}} <strong>{{.User.Email}}</strong>
    </p>

    <form method="POST" action="/admin/users/{{.User.ID}}/password">
        <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">

        {{if .IsSelf}}
        <div class="form-group">
            <label class="form-label" for="current_password">{{t "Aktuelles Passwort"}}</label>
            <input type="password" id="current_password" name="current_password" class="form-input" required>
        </div>
        {{end}}

        <div class="form-group">
            <label class="form-label" for="new_password">{{t "Neues Passwort"}}</label>
            <input type="password" id="new_password" name="new_password" class="form-input" required minlength="8">
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">{{t "Neues Passwort bestätigen"}}</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="8">
        </div>

        <button type="submit" class="btn btn--primary" hx-disabled-elt="this">{{t "Passwort ändern"}}</button>
    </form>
</div>
{{end}}
