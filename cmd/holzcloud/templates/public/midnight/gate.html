{{define "content"}}
<section class="gate">
  <h1>{{.Page.Title}}</h1>

  <p class="gate-lead">{{t "This page is protected by a password."}}</p>
  {{if .Gate.Hint}}<p class="gate-hint">{{.Gate.Hint}}</p>{{end}}
  {{if .Gate.Wrong}}<p class="gate-error" role="alert">{{t "The password is not right."}}</p>{{end}}

  <form class="gate-form" method="POST" action="/freischalten">
    <input type="hidden" name="seite" value="{{.Page.Slug}}">
    <div class="gate-form__field">
      <label for="gate-password">{{t "Password"}}</label>
      <input type="password" id="gate-password" name="passwort" required autofocus
             autocomplete="current-password">
    </div>
    <button type="submit" class="gate-form__submit">{{t "Continue"}}</button>
  </form>
</section>
{{end}}
