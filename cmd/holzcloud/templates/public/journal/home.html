{{define "content"}}
<article class="post post--home">
  {{if and .Page.Title (not .Page.HasOwnHeading)}}<h1>{{.Page.Title}}</h1>{{end}}
  {{if .Page.ContentHTML}}
  <div class="post-body">
    {{.Page.ContentHTML}}
  </div>
  {{else}}
  <p class="greeting">Willkommen bei {{.Site.Name}}.</p>
  {{end}}
</article>
{{end}}
