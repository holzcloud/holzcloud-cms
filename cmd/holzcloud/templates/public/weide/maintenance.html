{{define "content"}}
<section class="page page--notice">
  <div class="notice">
    <h1 class="notice__title">{{.Page.Title}}</h1>
    <!-- Der Betrieb hinterlegt hier oft nichts. Ein eigener Satz ist dann
         besser als eine leere Seite, auf der nur "Wartungsarbeiten" steht. -->
    <p class="notice__text">
      {{if .Meta.Message}}{{.Meta.Message}}
      {{else}}Wir sind gerade draussen bei den Tieren. Die Seite von {{.Site.Name}}
      ist gleich wieder da.{{end}}
    </p>
  </div>
</section>
{{end}}
