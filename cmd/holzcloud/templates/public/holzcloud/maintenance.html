{{define "content"}}
<section class="hc-wide page-wrap page--kurz">
  <p class="hc-eyebrow"><span class="hc-status hc-status--warn">{{t "Maintenance"}}</span></p>
  <h1 class="hc-title">{{.Page.Title}}</h1>
  {{with .Meta.Message}}<p class="hc-lede">{{.}}</p>
  {{else}}<p class="hc-lede">{{t "This website is being worked on and will be back shortly."}}</p>{{end}}
</section>
{{end}}
