<!-- Ein Rückfall-Favicon, damit ein Betrieb, der noch keines hochgeladen hat,
     nicht bei jedem Seitenaufruf einen 404 auf /favicon.ico erzeugt.

     Dasselbe Zeichen wie in der Leiste: der Wolkenbaum, eine Wolke als
     Krone auf einem Stamm, darin zwei Linien Maserung. currentColor gibt es
     hier nicht, ein Favicon erbt nichts; die beiden Farben sind hc-ground
     und hc-brass aus tokens.css. Die dunkle Kachel trägt das Zeichen auf
     hellen wie auf dunklen Tab-Leisten. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="">
  <rect width="200" height="200" rx="40" fill="#0A0705"/>
  <path d="M52 140 C30 140 18 124 22 108 C26 92 42 84 56 88 C60 64 80 50 102 52 C124 54 138 70 140 88 C156 82 176 92 178 110 C180 128 166 140 150 140 Z" transform="translate(0 -10)" fill="#F0AE5F"/>
  <path d="M100 128 L100 176" stroke="#F0AE5F" stroke-width="12" stroke-linecap="round"/>
  <path d="M100 150 L84 134 M100 142 L114 130" stroke="#F0AE5F" stroke-width="7" stroke-linecap="round"/>
  <g fill="none" stroke="#0A0705" stroke-width="3.5" stroke-linecap="round" opacity=".5">
    <path d="M60 112 C80 106 120 106 150 112"/>
    <path d="M78 92 C92 87 112 87 126 92"/>
  </g>
</svg>
