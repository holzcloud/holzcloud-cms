<!-- Ein Rückfall-Favicon, damit ein Betrieb, der noch keines hochgeladen hat,
     nicht bei jedem Seitenaufruf einen 404 auf /favicon.ico erzeugt.

     Dasselbe Zeichen wie in der Leiste: der Wolkenbaum, eine Wolke als
     Krone auf einem Stamm, darin zwei Linien Maserung, und darunter das
     Brett aus Holz, das die ganze Familie trägt. currentColor gibt es hier
     nicht, ein Favicon erbt nichts; Baum und Grund sind hc-brass und
     hc-ground aus tokens.css. Die dunkle Kachel trägt das Zeichen auf hellen
     wie auf dunklen Tab-Leisten. -->
