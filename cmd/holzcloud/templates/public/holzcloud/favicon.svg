<!-- Ein Rückfall-Favicon, damit ein Betrieb, der noch keines hochgeladen hat,
     nicht bei jedem Seitenaufruf einen 404 auf /favicon.ico erzeugt: den
     fordert der Browser von sich aus an, sobald die Seite keines nennt.

     Dasselbe Zeichen wie in der Leiste — der isometrische Würfel mit den
     Jahrringen im Anschnitt, gegen dieselbe 64er viewBox gezeichnet, nur um
     die Mitte etwas eingerückt, damit er nicht an der Ecke des Grundes klebt.

     currentColor gibt es hier nicht: ein Favicon wird ausserhalb des
     Dokuments gezeichnet und erbt nichts. Die beiden Werte stehen deshalb als
     einzige Stelle dieser Vorlage fest — es sind --hc-ground und --hc-brass
     aus tokens.css. Wer sie dort ändert, ändert sie auch hier.

     Kein prefers-color-scheme: diese Vorlage hat genau eine Stimmung, und sie
     bringt ihren eigenen dunklen Grund mit. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="">
  <rect width="64" height="64" rx="12" fill="#0A0705"/>
  <defs>
    <clipPath id="deck"><path d="M32 8 L58 21 L32 34 L6 21 Z"/></clipPath>
  </defs>
  <g transform="translate(32 32) scale(.82) translate(-32 -32)" fill="none" stroke="#F0AE5F">
    <g stroke-width="2.8" stroke-linejoin="round">
      <path d="M32 8 L58 21 L32 34 L6 21 Z"/>
      <path d="M6 21 L32 34 L32 56 L6 43 Z"/>
      <path d="M58 21 L32 34 L32 56 L58 43 Z"/>
    </g>
    <g clip-path="url(#deck)" stroke-width="2.2" opacity=".75">
      <ellipse cx="25" cy="18" rx="6" ry="3"/>
      <ellipse cx="25" cy="18" rx="12" ry="6"/>
      <ellipse cx="25" cy="18" rx="19" ry="9.5"/>
      <ellipse cx="25" cy="18" rx="27" ry="13.5"/>
    </g>
  </g>
</svg>
