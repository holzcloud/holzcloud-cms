{{define "content"}}
<section class="page page--notice">
  <div class="notice notice--gate">
    <h1 class="notice__title">{{.Page.Title}}</h1>
    <p class="notice__text">Diese Seite ist mit einem Passwort geschützt.</p>
    <!-- Der Hinweis des Betriebs sagt, woher das Passwort kommt. Ohne ihn steht
         jemand mit dem richtigen Passwort vor einem Feld und weiss nicht, ob er
         überhaupt an der richtigen Stelle ist. -->
    {{if .Gate.Hint}}<p class="gate-hint">{{.Gate.Hint}}</p>{{end}}
    {{if .Gate.Wrong}}<p class="gate-error" role="alert">Das Passwort stimmt nicht.</p>{{end}}

    <form class="gate-form" method="POST" action="/freischalten">
      <!-- Der Slug muss mit, sonst weiss die Gegenstelle nicht, welche Seite
           freigeschaltet werden soll. -->
      <input type="hidden" name="seite" value="{{.Page.Slug}}">
      <div class="gate-form__field">
        <label for="gate-passwort">Passwort</label>
        <input type="password" id="gate-passwort" name="passwort" required autofocus
               autocomplete="current-password">
      </div>
      <button type="submit" class="button gate-form__submit">Weiter</button>
    </form>
  </div>
</section>
{{end}}
