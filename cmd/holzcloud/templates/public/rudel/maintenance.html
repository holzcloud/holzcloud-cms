{{define "content"}}
<section class="page page--notice">
  <div class="notice">
    <h1 class="notice__title">{{.Page.Title}}</h1>
    <!-- Der Betrieb darf einen eigenen Satz hinterlegen; hinterlegt er keinen,
         braucht die Seite trotzdem einen, sonst steht hier nur die Überschrift. -->
    <p class="notice__text">
      {{if .Meta.Message}}{{.Meta.Message}}{{else}}Wir sind gleich wieder da.{{end}}
    </p>
    <p class="notice__text notice__text--quiet">{{.Site.Name}}</p>
  </div>
</section>
{{end}}
