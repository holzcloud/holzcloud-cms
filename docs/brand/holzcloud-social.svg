      <g fill="none" stroke="#F7F4EE" stroke-width="3.4">
        <circle cx="31" cy="34" r="4.6"/><circle cx="31" cy="34" r="11.4"/><circle cx="31" cy="34" r="18.2"/>
      </g>
    </g>
