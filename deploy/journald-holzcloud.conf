# journald drop-in for holzcloud-CMS: keep the system journal for 14 days.
#
# 14 days is the retention the privacy template of this release states for the
# request log (visitor addresses cut to /24 or /48). This file makes the host
# enforce it; the program cannot, because the journal belongs to journald.
#
# Install:
#   sudo install -D -m 0644 deploy/journald-holzcloud.conf /etc/systemd/journald.conf.d/holzcloud.conf
#   sudo systemctl restart systemd-journald
#
# Check afterwards. The output must list both values below:
#   systemd-analyze cat-config systemd/journald.conf
#
# Limits, each stated once:
# - The setting is system-wide. journald has no per-unit retention, so it
#   applies to the logs of every unit on the host.
# - journald deletes whole archived files. MaxFileSec=1d makes it start a new
#   file every day, so deletion happens in day steps; without it the default of
#   one month for the active file would let an entry live up to a month.
# - A journal kept only in memory (no /var/log/journal directory and Storage not
#   set to persistent) is lost at reboot. That is shorter than the limit and
#   never longer.
# - The behaviour was not played on a real host in the release that added this
#   file (the development machine has no systemd), so the check command above
#   is the owner's confirmation.

[Journal]
MaxRetentionSec=14d
MaxFileSec=1d
